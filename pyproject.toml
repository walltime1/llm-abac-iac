[project]
name = "rlm-agent"
version = "0.1.0"
description = "RLM-based ABAC policy miner and Z3 encoder for Ansible IaC"
requires-python = ">=3.13"
dependencies = [
    "dspy>=2.6",
    "nvdlib>=0.7",
    "univers>=30.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "litellm>=1.40",
    # tracing
    "arize-phoenix>=14.8.0",
    "arize-phoenix-otel>=0.15.0",
    "openinference-instrumentation-dspy>=0.1.34",
    "openinference-instrumentation-litellm>=0.1.30",
    "weasyprint>=68.1",
]

[project.optional-dependencies]
z3 = ["z3-solver>=4.12"]
test = ["pytest>=8.0", "pytest-timeout>=2.2"]

[project.scripts]
rlm-abac = "rlm_agent.cli.abac:main"
rlm-encode = "rlm_agent.cli.encode:main"
rlm-batch = "rlm_agent.cli.batch:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["rlm_agent"]

[tool.pytest.ini_options]
testpaths = ["rlm_agent/tests"]
timeout = 60
