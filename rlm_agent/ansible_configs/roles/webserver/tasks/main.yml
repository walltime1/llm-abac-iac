---
- name: Install nginx
  ansible.builtin.apt:
    name: "nginx={{ nginx_version }}"
    state: present
    update_cache: true

- name: Install OpenSSH server
  ansible.builtin.apt:
    name: "openssh-server={{ ssh_version }}"
    state: present

- name: Create app user
  ansible.builtin.user:
    name: appuser
    uid: 2001
    groups: www-data
    shell: /usr/sbin/nologin
    home: "{{ document_root }}"

- name: Provision shell users
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    groups: "{{ item.groups | join(',') }}"
    shell: /bin/bash
  loop: "{{ users }}"
  when: "'developers' in item.groups or 'sudo' in item.groups"

- name: Enforce document root ACL
  ansible.builtin.file:
    path: "{{ document_root }}"
    owner: appuser
    group: www-data
    mode: "0750"
    recurse: true

- name: Grant sudoers for deployment
  community.general.sudoers:
    name: "deploy-{{ item.name }}"
    user: "{{ item.name }}"
    commands:
      - /usr/bin/systemctl restart nginx
      - /usr/bin/systemctl reload nginx
    nopassword: true
  loop: "{{ users }}"
  when: "'sudo' in item.groups and item.clearance in ['secret','confidential']"

- name: Firewall — allow HTTPS from listed CIDRs
  ansible.posix.firewalld:
    source: "{{ item }}"
    port: "{{ http_port }}/tcp"
    permanent: true
    state: enabled
  loop: "{{ firewall_allow_from }}"

- name: Restrict SSH to approved groups
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^AllowGroups'
    line: "AllowGroups {{ allowed_ssh_groups | join(' ') }}"
