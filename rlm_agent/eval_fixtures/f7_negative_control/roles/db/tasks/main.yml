---
- name: Install PostgreSQL
  ansible.builtin.apt:
    name: "postgresql-16={{ postgres_version }}"
    state: present
    update_cache: true

- name: Ensure postgres data dir
  ansible.builtin.file:
    path: "{{ data_dir }}"
    owner: postgres
    group: postgres
    mode: "0700"
    state: directory

- name: Create DB superuser role
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    role_attr_flags: "LOGIN,SUPERUSER"
  loop: "{{ users }}"
  when: "'sudo' in item.groups"

- name: Create DB read-only role
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    role_attr_flags: "LOGIN,NOSUPERUSER"
  loop: "{{ users }}"
  when: "'developers' in item.groups"

- name: Allow postgres only from webservers subnet
  ansible.builtin.lineinfile:
    path: /etc/postgresql/pg_hba.conf
    line: "host all all {{ item }} scram-sha-256"
  loop: "{{ db_allow_from }}"
