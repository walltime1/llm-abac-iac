---
- name: Install nginx
  ansible.builtin.apt:
    name: "nginx={{ nginx_version }}"
    state: present
    update_cache: true

- name: Install OpenSSH server
  ansible.builtin.apt:
    name: "openssh-server={{ ssh_version }}"
    state: present

- name: Provision shell users
  ansible.builtin.user:
    name: "{{ item.name }}"
    uid: "{{ item.uid }}"
    groups: "{{ item.groups | join(',') }}"
    shell: /bin/bash
  loop: "{{ users }}"
  when: "'sudo' in item.groups"

- name: Grant sudo to admin users
  community.general.sudoers:
    name: "web-{{ item.name }}"
    user: "{{ item.name }}"
    commands: ALL
    nopassword: false
  loop: "{{ users }}"
  when: "'sudo' in item.groups and item.clearance == 'secret'"

- name: Firewall — allow HTTPS from internet
  ansible.posix.firewalld:
    source: "{{ item }}"
    port: "{{ http_port }}/tcp"
    permanent: true
    state: enabled
  loop: "{{ firewall_allow_from }}"

- name: Restrict SSH to sudo group
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^AllowGroups'
    line: "AllowGroups {{ allowed_ssh_groups | join(' ') }}"
