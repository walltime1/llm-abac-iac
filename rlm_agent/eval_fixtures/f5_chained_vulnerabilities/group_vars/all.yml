---
org: chaincorp
compliance_tier: pci
default_log_retention_days: 365

# Every hop has a deliberately vulnerable package.
ssh_version_bastion: "1:9.1p1-1ubuntu1"
httpd_version: "2.4.49-1"
log4j_version: "2.14.1"
postgres_version: "9.2.3-1.pgdg20.04+1"

# Shared safe SSH for non-bastion hosts
ssh_version: "1:9.9p1-3ubuntu1"

users:
  - name: admin
    uid: 1001
    groups: [sudo]
    department: operations
    clearance: secret
  - name: developer
    uid: 1002
    groups: [developers]
    department: engineering
    clearance: confidential
  - name: dba
    uid: 1003
    groups: [dba]
    department: data
    clearance: secret
