---
- name: Install Java runtime with Log4j (vulnerable)
  ansible.builtin.apt:
    name:
      - default-jre
    state: present

- name: Deploy application with Log4j {{ log4j_version }}
  ansible.builtin.copy:
    src: app.jar
    dest: /opt/app/app.jar

- name: Install Log4j library (pinned vulnerable version)
  ansible.builtin.get_url:
    url: "https://repo1.maven.org/maven2/org/apache/logging/log4j/log4j-core/{{ log4j_version }}/log4j-core-{{ log4j_version }}.jar"
    dest: /opt/app/lib/log4j-core-{{ log4j_version }}.jar

- name: Install OpenSSH server
  ansible.builtin.apt:
    name: "openssh-server={{ ssh_version }}"
    state: present

- name: Firewall — allow app port from web subnet
  ansible.posix.firewalld:
    source: "{{ item }}"
    port: "{{ app_port }}/tcp"
    permanent: true
    state: enabled
  loop: "{{ firewall_allow_from }}"

- name: Restrict SSH to approved groups
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^AllowGroups'
    line: "AllowGroups {{ allowed_ssh_groups | join(' ') }}"
