---
- name: Install OpenSSH server (vulnerable)
  ansible.builtin.apt:
    name: "openssh-server={{ ssh_version_bastion }}"
    state: present
    update_cache: true

- name: Restrict bastion logins
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^AllowGroups'
    line: "AllowGroups {{ allowed_ssh_groups | join(' ') }}"

- name: Firewall — allow SSH from internet
  ansible.posix.firewalld:
    source: "{{ item }}"
    port: 22/tcp
    permanent: true
    state: enabled
  loop: "{{ firewall_allow_from }}"

- name: Only secret-clearance may sudo
  community.general.sudoers:
    name: "bastion-{{ item.name }}"
    user: "{{ item.name }}"
    commands: ALL
    nopassword: false
  loop: "{{ users }}"
  when: "'sudo' in item.groups and item.clearance == 'secret'"
