---
- name: Install PostgreSQL
  ansible.builtin.apt:
    name: "postgresql-13={{ postgres_version }}"
    state: present
    update_cache: true

- name: Install OpenSSH server
  ansible.builtin.apt:
    name: "openssh-server={{ ssh_version }}"
    state: present

- name: Ensure postgres data dir
  ansible.builtin.file:
    path: "{{ data_dir }}"
    owner: postgres
    group: postgres
    mode: "0700"
    state: directory

- name: Create DB superuser role for DBAs
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    role_attr_flags: "LOGIN,SUPERUSER"
  loop: "{{ users }}"
  when: "'dba' in item.groups"

- name: Create DB read-only role for developers
  community.postgresql.postgresql_user:
    name: "{{ item.name }}"
    role_attr_flags: "LOGIN,NOSUPERUSER"
  loop: "{{ users }}"
  when: "'developers' in item.groups"

- name: Allow postgres only from appservers subnet
  ansible.builtin.lineinfile:
    path: /etc/postgresql/pg_hba.conf
    line: "host all all {{ item }} scram-sha-256"
  loop: "{{ db_allow_from }}"

- name: Restrict SSH to sudo and dba groups
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^AllowGroups'
    line: "AllowGroups sudo dba"
