---
org: segcorp
compliance_tier: pci
default_log_retention_days: 365

nginx_version: "1.20.0-1~focal"
ssh_version: "1:9.6p1-3ubuntu1"
postgres_version: "13.7-1.pgdg20.04+1"

users:
  - name: admin
    uid: 1001
    groups: [sudo]
    department: operations
    clearance: secret
  - name: developer
    uid: 1002
    groups: [developers]
    department: engineering
    clearance: confidential
  - name: dba
    uid: 1003
    groups: [dba]
    department: data
    clearance: secret
