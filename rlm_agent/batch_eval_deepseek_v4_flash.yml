# DeepSeek V4 Flash × 7 fixtures × 3 runs = 21 runs

models:
  - opencode-go/deepseek-v4-flash

ansible_dirs:
  - eval_fixtures/f1_minimal_twotier
  - eval_fixtures/f2_threetier_segmented
  - eval_fixtures/f3_privsep_service_accounts
  - eval_fixtures/f4_patched_vs_vulnerable
  - eval_fixtures/f5_chained_vulnerabilities
  - eval_fixtures/f6_intent_vs_effective
  - eval_fixtures/f7_negative_control

runs: 3

defaults:
  interpreter: local
  max_iterations: 25
  max_tokens: 64000
  reasoning: auto
  retries: 5
  trace: true
  phoenix_project: eval-deepseek-v4-flash
  no_cache: true
  policy_goal: all
  max_parallel: 4
  phase_order: eager
