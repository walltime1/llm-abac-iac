# Round 2: Kimi K2.6 + MiniMax M2.7 × all fixtures × 1 run
# Budget: ~$3.78 + ~$1.26 = ~$5.04

models:
  - opencode-go/kimi-k2.6
  - opencode-go/minimax-m2.7

ansible_dirs:
  - eval_fixtures/f1_minimal_twotier
  - eval_fixtures/f2_threetier_segmented
  - eval_fixtures/f3_privsep_service_accounts
  - eval_fixtures/f4_patched_vs_vulnerable
  - eval_fixtures/f5_chained_vulnerabilities
  - eval_fixtures/f6_intent_vs_effective
  - eval_fixtures/f7_negative_control

runs: 3

defaults:
  interpreter: local
  max_iterations: 25
  max_tokens: 64000
  reasoning: auto
  retries: 5
  trace: true
  phoenix_project: eval-round2-kimi-minimax
  no_cache: true
  policy_goal: all
  max_parallel: 2
  phase_order: eager
