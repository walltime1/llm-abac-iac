# Debug: all 7 fixtures x 1 model x 1 run
# Usage: python batch_run.py --config batch_debug_fixtures.yml

models:
  - opencode-go/qwen3.6-plus

ansible_dirs:
  - eval_fixtures/f1_minimal_twotier
  - eval_fixtures/f2_threetier_segmented
  - eval_fixtures/f3_privsep_service_accounts
  - eval_fixtures/f4_patched_vs_vulnerable
  - eval_fixtures/f5_chained_vulnerabilities
  - eval_fixtures/f6_intent_vs_effective
  - eval_fixtures/f7_negative_control

runs: 1

defaults:
  interpreter: local
  max_iterations: 25
  max_tokens: 64000
  reasoning: auto
  retries: 5
  trace: true
  phoenix_project: fixed-openrouter-qwen3.6plus
  no_cache: true
  policy_goal: all
  max_parallel: 1
